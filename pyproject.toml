[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-checker"
version = "1.0"
description = "Frame Checker is a PySide6 application for checking video frames using ffmpeg filters."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [{ name = "Vuk Knezevic", email = "kuvk.me@gmail.com" }]
dependencies = [
    "ffmpeg-progress-yield>=0.11.3",
    "PySide6>=6.8.1",
    "qtmodern>=0.2.0",
    "tabulate>=0.9.0",
]
keywords = ["ffmpeg", "video", "detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
frame-checker = "frame_checker.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frame_checker"]

[tool.setuptools.package-data]
"frame_checker" = ["app/*", "default_settings.ini"]
